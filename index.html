<!DOCTYPE html>
<html lang="en">
<head>
<title>A Slice of Life</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="NavBar">
    <img src="logo.png" alt="Logo">
    <h1>A Slice of Life | Home</h1>

<div class="buttons">
    <button onclick="location.href='index.html'">Home</button>
    <button onclick="location.href='Menu.html'">Menu</button>    
</div>
<div class="loginMenu">
     <button class="login" title="Login" onclick="showMenu()">
     <img src="login.png" alt="Login">
     </button>

     <div id="menu"></div>
</div>

</div> 

<h1 class="menuTitle">Welcome to A Slice of Life</h1>

<div class="loginBox">
    <h2>Fresh Pizza, Great Prices!</h2>

    <p>
        Welcome to A Slice of Life. We serve freshly made pizzas,
        tasty sides and cold drinks. Click the button below to start
        your order.

    </p>

    <button class="orderButton" onclick="startOrder()">
        Start Your Order!
    </button>
</div>



<footer>
    <p>&copy; 2026 A Slice of Life</p>
</footer>
<script src="script.js"></script>
</body>
</html>
