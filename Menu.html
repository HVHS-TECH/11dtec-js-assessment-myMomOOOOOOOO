<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="NavBar">
    <img src="logo.png" alt="Logo">
    <h1>A Slice of Life</h1>

    <div class="buttons">
      <button onclick="location.href='index.html'" title=>Home</button>
      <button onclick="location.href='Menu.html'" title=>Menu</button>
      <button onclick="location.href='Offers.html'" title=>Offers</button>
    </div>

    <div class="loginMenu">
        <button class="login" title="Login" onclick="showMenu()">
            <img src="login.png" alt="login">
        </button>

        <div id="menu"></div>
    </div>
</div>

<div class="loginBox">

    <h2>Start Your Order</h2>

    <input type="text" id="customerName" placeholder="Enter Your Name">
    
    <br><br>

    <input type="number" id="money" placeholder="Money Given">
    
    <br><br>

    <button onclick="finishOrder()">Finish Order</button>

    <button onclick="resetOrder()">Reset Order</button>

    <div id="receipt"></div>

</div>
    
<h1 class="menuTitle">Our Menu</h1>

<h2 class="sectionTitle">Pizzas</h2>

<div class="menuRow">

    <div class="Item">
        <h2>Margherita Pizza</h2>
        <p>$15.00</p>

        <img src="Margarita.png"  alt="Margarita">


        <input 
        type="number" 
        id="marQuantity" 
        placeholder="0" 
        min="0">
    </div>

    <div class="Item">
        <h2>Pepperoni Pizza</h2>
        <p>$18.00</p>

        <img src="Pepperoni.png" alt="Pepperoni">


        <input 
        type="number" 
        id="pepQuantity" 
        placeholder="0" 
        min="0">
    </div>

    <div class="Item">
        <h2>Hawaiian Pizza</h2>
        <p>$18.00</p>

        <img src="Hawaiian.png" alt="HawaiianPizza">


        <input 
        type="number" 
        id="HawQuantity" 
        placeholder="0" 
        min="0">
    </div>

    <div class="Item">
        <h2>Meatlovers Pizza</h2>
        <p>$20.00</p>

        <img src="Meatlovers.png" alt="Meatlovers">

        <input 
        type="number" 
        id="meatQuantity" 
        placeholder="0" 
        min="0">
    </div>

    <div class="Item">
        <h2>Vegetarian Pizza</h2>
        <p>$16.00</p>

        <img src="Vegetarian.png" alt="Vegetarian">

        <input 
        type="number" 
        id="vegQuantity" 
        placeholder="0" 
        min="0">
    </div>
</div>
<h2 class="sectionTitle">Sides</h2>

<div class="menuRow">

    <div class="Item">
        <h2>Garlic Bread</h2>
        <p>$8.00</p>

         <img src="GarlicBread.png" alt="GarlicBread">

        <input 
        type="number" 
        id="garQuantity" 
        placeholder="0" 
        min="0">
    </div>


    <div class="Item">
        <h2>Fries</h2>
        <p>$8.50</p>

         <img src="Fries.png" alt="Fries">

        <input 
        type="number" 
        id="friQuantity" 
        placeholder="0" 
        min="0">
    </div>
</div>
<h2 class="sectionTitle">Drinks</h2>

<div class="menuRow">

<div class="Item">
        <h2>Coke</h2>
        <p>$5.00</p>

         <img src="Coke.png" alt="Coke">

        <input 
        type="number" 
        id="cokeQuantity" 
        placeholder="0" 
        min="0">
    </div>

    <div class="Item">
        <h2>Sprite</h2>
        <p>$5.00</p>

         <img src="Sprite.png" alt="Sprite">

        <input 
        type="number" 
        id="sprQuantity" 
        placeholder="0" 
        min="0">
    </div>
</div>
<footer>
    <p>&copy; 2026 A Slice of Life</p>
</footer>
    <script src="script.js"></script>
</body>
</html>
